name: Deploy clientes (HostGator FTP)

on:
  push:
    paths:
      - "clientes/**"
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug do cliente (pasta em clientes/)"
        required: true
      diagnostico:
        description: "Só verificar os secrets (não faz login nem deploy)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir clientes alterados
        id: slugs
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_SLUG: ${{ github.event.inputs.slug }}
        run: |
          if [ -n "$INPUT_SLUG" ]; then
            slugs="$INPUT_SLUG"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            slugs=$(git diff-tree --root --no-commit-id --name-only -r HEAD -- clientes | cut -d/ -f2 | sort -u)
          else
            slugs=$(git diff --name-only "$BEFORE" HEAD -- clientes | cut -d/ -f2 | sort -u)
          fi
          echo "list=$(echo $slugs)" >> "$GITHUB_OUTPUT"
          echo "Clientes: $slugs"

      - name: IP público deste runner
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org || echo "indisponível")
          echo "IP público do runner: $ip"
          echo "IP do runner: $ip" >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar secrets (sem exibir valores)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          python3 - <<'PY'
          import os
          for k in ("FTP_HOST", "FTP_USER", "FTP_PASS"):
              v = os.environ.get(k, "")
              avisos = []
              if v != v.strip(): avisos.append("TEM ESPAÇO/QUEBRA DE LINHA nas pontas")
              if any(c in v for c in "\r\n\t"): avisos.append("tem quebra de linha/tab")
              if v[:1] in "\"'" and v[-1:] in "\"'" and len(v) > 1: avisos.append("está entre aspas")
              print(f"{k}: {len(v)} caracteres" + (" -> " + "; ".join(avisos) if avisos else " (ok)"))
          print("FTP_HOST esperado:", os.environ["FTP_HOST"].strip() == "br542.hostgator.com.br")
          print("FTP_USER == vito1304:", os.environ["FTP_USER"].strip() == "vito1304")
          PY

      - name: Deploy via FTP
        if: ${{ github.event.inputs.diagnostico != 'true' }}
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          BASE_DOMAIN: vetordigital.tech
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::error::Secrets FTP_HOST/FTP_USER/FTP_PASS não configurados (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          for slug in ${{ steps.slugs.outputs.list }}; do
            if [ -d "clientes/$slug" ]; then
              python3 scripts/deploy.py "clientes/$slug" "$slug"
              echo "🔗 https://$slug.vetordigital.tech/" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
